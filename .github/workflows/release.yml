name: Release

# A pushed v* tag publishes to npm, creates the GitHub release with the
# standalone binaries, and updates the Homebrew tap. A manual run never
# publishes to npm. See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearsal: no GitHub release, no tap push. Unchecked, the run must be on the release tag (--ref vX.Y.Z). npm is never published from a manual run.'
        type: boolean
        default: true

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  # 'true' only for a manual run with dry_run checked (the default)
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      # A manual run that creates a release must run on the release tag itself,
      # so the release never gets (or, with --clobber, swaps in) binaries built
      # from other code. A tag push always runs on its own tag.
      - name: Check that a non-dry manual run is on the release tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if ! git fetch --no-tags --depth=1 origin "+refs/tags/${TAG}:refs/tags/${TAG}"; then
            echo "::error::Tag ${TAG} does not exist. A manual run with dry_run unchecked only re-releases an existing tag."
            exit 1
          fi
          TAG_SHA=$(git rev-parse "${TAG}^{commit}")
          if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::${TAG} is commit ${TAG_SHA}, but this run is on ${GITHUB_SHA}. Run it on the tag: gh workflow run release.yml --ref ${TAG} -f dry_run=false"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # npm trusted publishing needs Node 22.14+ and npm 11.5.1+.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Use npm 11.5.1 or later
        run: |
          npm install -g npm@^11.5.1
          echo "node $(node --version), npm $(npm --version)"

      - run: bun install --frozen-lockfile

      - run: bun run test

      - run: bun run build

      - run: bun run test:dist

      - name: Get version metadata
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "cmdk-engine@${VERSION}" version 2>/dev/null)" = "${VERSION}" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify pushed tag matches package.json version
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref_name }}" != "${{ steps.meta.outputs.tag }}" ]; then
            echo "::error::Pushed tag ${{ github.ref_name }} does not match package.json version (${{ steps.meta.outputs.tag }}). Run 'changeset version' and retag."
            exit 1
          fi

      # `changeset publish` runs `npm publish` here (it only switches to pnpm in
      # pnpm repos) for versions not yet on npm. It does not consume changesets;
      # `changeset version` did that in the version PR.
      - name: Publish to npm via Changesets
        if: github.event_name == 'push'
        run: |
          if [ "${{ steps.meta.outputs.published }}" = "true" ]; then
            echo "::warning::cmdk-engine@${{ steps.meta.outputs.version }} is already on npm, so this run publishes nothing (and adds no provenance)."
          fi
          bun run release
        env:
          # Fallback when trusted publishing is not set up: npm tries OIDC first
          # and uses this token only when that fails.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # npm 11 refuses a publish dry run over a version that is already on npm,
      # so that case is packed instead.
      - name: Rehearse the npm publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ steps.meta.outputs.published }}" = "true" ]; then
            echo "::notice::cmdk-engine@${{ steps.meta.outputs.version }} is already on npm. Packing instead of a publish dry run."
            npm pack --dry-run
          else
            npm publish --dry-run
          fi

  # Build the standalone binaries as workflow artifacts. The release job
  # attaches them once all three have built.
  binaries:
    needs: publish
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            binary_name: cmdk-engine-darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
            binary_name: cmdk-engine-darwin-x64
          - os: ubuntu-latest
            target: linux-x64
            binary_name: cmdk-engine-linux-x64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Compile standalone binary
        run: bun build dist/cli/index.cjs --compile --outfile dist/${{ matrix.binary_name }}

      - name: Run the binary
        run: dist/${{ matrix.binary_name }} --version

      # Run inside dist/ so the file names the bare binary, and
      # `shasum -c <name>.sha256` works next to the downloaded release asset.
      - name: Generate checksum
        working-directory: dist
        run: shasum -a 256 ${{ matrix.binary_name }} > ${{ matrix.binary_name }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/${{ matrix.binary_name }}
            dist/${{ matrix.binary_name }}.sha256
          if-no-files-found: error
          overwrite: true

      - uses: actions/upload-artifact@v7
        with:
          name: checksum-${{ matrix.target }}
          path: dist/${{ matrix.binary_name }}.sha256
          if-no-files-found: error
          overwrite: true

  # One GitHub release with every binary, only after all three built. With
  # assets, `gh release create` makes a draft, uploads them, then publishes it,
  # so install.sh (which reads releases/latest) never sees a release without
  # binaries. Skipped in a rehearsal.
  release:
    needs: [publish, binaries]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.publish.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Create the release, or replace the binaries of an existing one
        run: |
          ls -l dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi

  # Update the Homebrew tap formula. A rehearsal stops at `git push --dry-run`,
  # which still checks that HOMEBREW_TAP_TOKEN can push to the tap.
  update-homebrew:
    needs: [publish, binaries, release]
    # Runs after the release, or after the binaries when a rehearsal skips it.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: checksum-*
          merge-multiple: true
          path: checksums

      - name: Get version and checksums
        id: meta
        run: |
          echo "version=${{ needs.publish.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ needs.publish.outputs.tag }}" >> "$GITHUB_OUTPUT"
          for target in darwin-arm64 darwin-x64 linux-x64; do
            sha=$(awk '{print $1}' "checksums/cmdk-engine-${target}.sha256")
            echo "${target//-/_}_sha=${sha}" >> "$GITHUB_OUTPUT"
          done

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Clone the tap repo
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Priyans-hu/homebrew-tap.git" /tmp/tap
          cd /tmp/tap

          mkdir -p Formula

          cat > Formula/cmdk-engine.rb << 'FORMULA_EOF'
          class CmdkEngine < Formula
            desc "Smart command palette engine — route scanner and config generator"
            homepage "https://github.com/Priyans-hu/cmdk-engine"
            version "${{ steps.meta.outputs.version }}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Priyans-hu/cmdk-engine/releases/download/${{ steps.meta.outputs.tag }}/cmdk-engine-darwin-arm64"
                sha256 "${{ steps.meta.outputs.darwin_arm64_sha }}"
              else
                url "https://github.com/Priyans-hu/cmdk-engine/releases/download/${{ steps.meta.outputs.tag }}/cmdk-engine-darwin-x64"
                sha256 "${{ steps.meta.outputs.darwin_x64_sha }}"
              end
            end

            on_linux do
              url "https://github.com/Priyans-hu/cmdk-engine/releases/download/${{ steps.meta.outputs.tag }}/cmdk-engine-linux-x64"
              sha256 "${{ steps.meta.outputs.linux_x64_sha }}"
            end

            def install
              binary = Dir["cmdk-engine-*"].first
              bin.install binary => "cmdk-engine"
            end

            test do
              assert_match "cmdk-engine", shell_output("#{bin}/cmdk-engine --help")
            end
          end
          FORMULA_EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cmdk-engine.rb
          # A failed commit or push fails the job.
          if git diff --cached --quiet; then
            echo "Formula/cmdk-engine.rb is already up to date."
          else
            git commit -m "Update cmdk-engine to ${{ steps.meta.outputs.version }}"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            git push --dry-run
          else
            git push
          fi
