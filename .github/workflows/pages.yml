name: Deploy Docs

on:
  push:
    branches: [main]
    # The live demo runs this repo's build, and the registry items come from
    # examples/shadcn, so library changes redeploy too.
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - 'examples/shadcn/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsup.config.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Install docs dependencies
        working-directory: docs
        run: bun install --frozen-lockfile

      # docs/package.json does not list cmdk-engine: this puts the build above in
      # docs/node_modules, so the site never runs the npm release.
      - name: Use this repo's build in the docs
        run: node scripts/local-build.mjs docs

      - name: Build docs
        working-directory: docs
        run: bun run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
